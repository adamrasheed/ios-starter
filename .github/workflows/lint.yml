name: Lint

# The only AUTOMATIC job, deliberately. A full build+test needs a macOS runner, and on a
# private repo macOS bills at 10x. This job is the fast gate that catches the majority of
# mechanical problems for roughly 20 seconds of 1x Linux time. See build-test.yml for the
# expensive half and the cost math behind the split.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A second push to the same PR cancels the in-flight run.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swiftlint:
    name: SwiftLint
    # Ubuntu, not macOS. SwiftLint runs fine on Linux and needs no Xcode, and on a private
    # repo Linux bills at 1x versus macOS at 10x. Running this on macOS would cost about ten
    # times as much for a byte-identical result. Do not "simplify" this to macos-latest.
    runs-on: ubuntu-latest
    # Pinned to the exact version .swiftlint.yml was tuned against. Do NOT float this to
    # `latest`: a new SwiftLint release can add rules, and with --strict that turns CI red
    # with no source change. Bump it deliberately, re-run locally, commit the config fixes.
    container: ghcr.io/realm/swiftlint:0.65.0
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show SwiftLint version
        run: swiftlint version

      # Paths passed explicitly rather than via `included:` in the config, because `included:`
      # resolves relative to the config file and is easy to get silently wrong.
      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging Starter StarterTests

      # House style: no em dashes in anything a user can read. This runs in CI because nothing
      # else catches it, and it does reach production: shipped apps from this template have put
      # em dashes into in-app strings and into a published support page, each needing its own
      # cleanup commit during the week of submission.
      #
      # Scoped to Swift sources and the App Store metadata package. Docs and code comments are
      # not user-facing and are not checked.
      - name: No em dashes in user-facing text
        run: |
          hits=$(grep -rn '—' --include='*.swift' Starter StarterTests || true)
          if [ -d appstore/metadata ]; then
            hits="${hits}$(grep -rn '—' appstore/metadata || true)"
          fi
          if [ -n "$(printf '%s' "$hits" | tr -d '[:space:]')" ]; then
            echo "Em dashes found. Rewrite the sentence, or use a period, comma, colon or parentheses."
            printf '%s\n' "$hits"
            exit 1
          fi
